name: Validate catalog

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator dependency
        run: python -m pip install --upgrade pip && pip install jsonschema

      - name: Validate index.json against index.schema.json
        run: python scripts/validate_index.py --require-jsonschema

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
